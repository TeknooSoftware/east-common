framework:
  test: true
  secret: 'foo-bar'
  form: ~
  session:
    storage_factory_id: 'Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory'
  http_method_override: true
  csrf_protection:
    enabled: false
  router:
    default_uri: 'https://teknoo.software/'
  notifier:
    channel_policy:
      urgent: ['email']
      high: ['email']
      medium: ['email']
      low: ['email']
    admin_recipients:
      - { email: 'contact@teknoo.software' }
  # Enabled only in API mode (see config/api), to keep light containers of the HTML mode
  serializer:
    enabled: false
